name: Publish compact.4 release assets

on:
  push:
    branches: [release/compact-4]
    paths: ['.github/workflows/publish-compact-4.yml']

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Publish the verified Windows patch and the existing Linux archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: kvads/v2rayN-Compact-GUI
        shell: bash
        run: |
          set -euo pipefail
          tag=v8.0.1-compact.4
          previous=v8.0.1-compact.3
          windows=v2rayN-compact-windows-x64.zip
          linux=v2rayN-compact-linux-x64.tar.gz

          test "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" = "$previous"
          test -z "$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq '.[].ref')"
          test "$(gh api "repos/$GH_REPO/actions/runs/45626718397" --jq .conclusion)" = success
          gh api "repos/$GH_REPO/actions/artifacts/15028459052/zip" > "$windows"
          gh release download "$previous" --pattern "$linux"
          cat > SHA256SUMS.txt <<'SUMS'
          b2bf61f9b2c00e2f9d5831ce99891e068f1bb973c893ef67506cd1e3da43b7eb  v2rayN-compact-linux-x64.tar.gz
          3281f07f36eeaf8ddfddbe5075c14aa6b187dfe77bce1f34ab4e3fcf2560f110  v2rayN-compact-windows-x64.zip
          SUMS
          sha256sum --check SHA256SUMS.txt
          cat > notes.md <<'NOTES'
          Windows notifications now appear in a rounded dark panel above the routing selector. The active profile name has room for two lines and its full text is available on hover. The hint stays below the name, and the whole card opens the configuration picker.

          The picker is 440 device-independent pixels wide and can be resized vertically. Configuration cards fill the list width, keeping actions and measurements aligned for short and long names.

          Verified using the packaged Windows x64 executable with two local test profiles, clipboard import, profile switching, a queued notification, and horizontal and vertical resize attempts. To update, exit v2rayN from the tray and extract the ZIP into the folder containing `v2rayN.exe`. Keep your `guiConfigs` folder to retain your profiles.
          NOTES
          gh release create "$tag" "$windows" "$linux" SHA256SUMS.txt --target 202e9b0fc5d3278cba9532e0f16f326d1b5ad571 --latest --title 'v8.0.1-compact.4 — Windows profile layout and notifications' --notes-file notes.md
