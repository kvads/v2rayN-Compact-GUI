name: Check compact Windows x64 release

on:
  push:
    branches: [build/windows-compact-4]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Retrieve the verified portable build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/kvads/v2rayN-Compact-GUI/actions/artifacts/15028459052/zip > portable.zip
          echo '3281f07f36eeaf8ddfddbe5075c14aa6b187dfe77bce1f34ab4e3fcf2560f110  portable.zip' | sha256sum --check
      - name: Extract the Windows build
        shell: pwsh
        run: |
          [IO.Compression.ZipFile]::ExtractToDirectory((Join-Path $PWD 'portable.zip'), $env:RUNNER_TEMP)
      - name: Verify labels and the settings command in the portable build
        shell: powershell
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'v2rayN-compact-windows-x64'
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $app = Start-Process -FilePath (Join-Path $bundle 'v2rayN.exe') -WorkingDirectory $bundle -PassThru -WindowStyle Hidden
          try {
              $until = (Get-Date).AddSeconds(45)
              do {
                  Start-Sleep -Milliseconds 300
                  $app.Refresh()
                  if ($app.HasExited) { throw "v2rayN exited with code $($app.ExitCode)" }
              } until ($app.MainWindowHandle -ne 0 -or (Get-Date) -gt $until)
              if ($app.MainWindowHandle -eq 0) { throw 'Main window did not open' }
              $main = [Windows.Automation.AutomationElement]::FromHandle($app.MainWindowHandle)
              $scope = [Windows.Automation.TreeScope]::Descendants
              function Find-Named($element, $name) {
                  $condition = New-Object Windows.Automation.PropertyCondition([Windows.Automation.AutomationElement]::NameProperty, $name)
                  $element.FindFirst($scope, $condition)
              }
              $until = (Get-Date).AddSeconds(30)
              do {
                  $connect = Find-Named $main 'Connect'
                  $profile = Find-Named $main 'No matching configurations'
                  if ($connect -and $profile) { break }
                  Start-Sleep -Milliseconds 250
              } while ((Get-Date) -lt $until)
              if (!$connect -or !$profile -or !$connect.Current.IsEnabled) { throw 'Connection or profile binding is missing' }
              Write-Host "Connection button: $($connect.Current.Name); profile: $($profile.Current.Name)"
              $gear = Find-Named $main 'Option Setting'
              $gear.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern).Invoke()
              $pidCondition = New-Object Windows.Automation.PropertyCondition([Windows.Automation.AutomationElement]::ProcessIdProperty, $app.Id)
              $until = (Get-Date).AddSeconds(15)
              do {
                  $windows = [Windows.Automation.AutomationElement]::RootElement.FindAll([Windows.Automation.TreeScope]::Children, $pidCondition)
                  $settings = $windows | Where-Object { $_.Current.Name -eq 'Settings' }
                  if (!$settings) { $settings = Find-Named $main 'Settings' }
                  if ($settings) { break }
                  Start-Sleep -Milliseconds 200
              } while ((Get-Date) -lt $until)
              if (!$settings) { throw 'The settings command did not open its window' }
              Write-Host 'Settings opened from the main window.'
          } finally {
              if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - name: Exercise notification, selected profile, and picker layout
        shell: powershell
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'v2rayN-compact-windows-x64'
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes, System.Drawing, System.Windows.Forms, WindowsBase
          [Windows.Forms.Cursor]::Position = [Drawing.Point]::new(2, 2)
          $ae = [Windows.Automation.AutomationElement]
          $desc = [Windows.Automation.TreeScope]::Descendants
          function Find-Name($root, $name) {
              $condition = New-Object Windows.Automation.PropertyCondition($ae::NameProperty, $name)
              $root.FindFirst($desc, $condition)
          }
          function Of-Type($root, $type) {
              $condition = New-Object Windows.Automation.PropertyCondition($ae::ControlTypeProperty, $type)
              $root.FindAll($desc, $condition)
          }
          function Wait-For($description, [scriptblock]$query) {
              $deadline = (Get-Date).AddSeconds(45)
              do {
                  $value = & $query
                  if ($value) { return $value }
                  Start-Sleep -Milliseconds 120
              } while ((Get-Date) -lt $deadline)
              throw "Timed out waiting for $description"
          }
          function Invoke-Button($button) {
              $button.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern).Invoke()
          }
          function Capture-Window($window, $name) {
              $rectangle = $window.Current.BoundingRectangle
              $bmp = New-Object Drawing.Bitmap([int]$rectangle.Width, [int]$rectangle.Height)
              $g = [Drawing.Graphics]::FromImage($bmp)
              try {
                  $g.CopyFromScreen([int]$rectangle.X, [int]$rectangle.Y, 0, 0, $bmp.Size)
                  $bmp.Save((Join-Path $env:RUNNER_TEMP "$name.png"), [Drawing.Imaging.ImageFormat]::Png)
                  $stream = New-Object IO.MemoryStream
                  try {
                      $bmp.Save($stream, [Drawing.Imaging.ImageFormat]::Jpeg)
                      Write-Host ("LAYOUT_PREVIEW_" + $name + "=" + [Convert]::ToBase64String($stream.ToArray()))
                  } finally { $stream.Dispose() }
              } finally { $g.Dispose(); $bmp.Dispose() }
          }
          $app = Start-Process -FilePath (Join-Path $bundle 'v2rayN.exe') -WorkingDirectory $bundle -PassThru -WindowStyle Hidden
          try {
              $handle = Wait-For 'main window' { $app.Refresh(); if ($app.HasExited) { throw "App exited: $($app.ExitCode)" }; $app.MainWindowHandle.ToInt64() }
              $main = $ae::FromHandle([IntPtr]$handle)
              $pickerButton = Wait-For 'configuration picker button' { Find-Name $main 'Open configurations' }
              Invoke-Button $pickerButton
              $pidCondition = New-Object Windows.Automation.PropertyCondition($ae::ProcessIdProperty, $app.Id)
              $picker = Wait-For 'Configurations window' {
                  $windows = $ae::RootElement.FindAll([Windows.Automation.TreeScope]::Children, $pidCondition)
                  $found = $windows | Where-Object { $_.Current.Name -eq 'Configurations' } | Select-Object -First 1
                  if ($found) { $found } else { Find-Name $main 'Configurations' }
              }
              $paste = Wait-For 'clipboard import' { Find-Name $picker 'Add from clipboard' }
              $name = 'Layout-check-' + ('long-profile-name-' * 8) + 'end'
              Set-Clipboard -Value ("socks://127.0.0.1:23001#Short" + [Environment]::NewLine + "socks://127.0.0.1:23002#$name")
              Invoke-Button $paste
              $longButton = Wait-For 'long profile in picker' { Find-Name $picker $name }
              $list = @(Of-Type $picker ([Windows.Automation.ControlType]::List))[0]
              $rows = @(Of-Type $list ([Windows.Automation.ControlType]::ListItem))
              if ($rows.Count -ne 2) { throw "Expected two profile cards, found $($rows.Count)" }
              $edges = foreach ($row in $rows) {
                  $buttons = @(Of-Type $row ([Windows.Automation.ControlType]::Button))
                  ($buttons | ForEach-Object { $_.Current.BoundingRectangle.Right } | Measure-Object -Maximum).Maximum
              }
              $listBounds = $list.Current.BoundingRectangle
              $initial = $picker.Current.BoundingRectangle
              $scale = $initial.Width / 440.0
              foreach ($edge in $edges) {
                  if ([Math]::Abs($listBounds.Right - $edge) -gt 25 * $scale) { throw "Card stops at $edge, list ends at $($listBounds.Right)" }
              }
              if ([Math]::Abs($edges[0] - $edges[1]) -gt 2 * $scale) { throw 'Short and long cards have different widths' }
              $resize = $picker.GetCurrentPattern([Windows.Automation.TransformPattern]::Pattern)
              try { $resize.Resize($initial.Width + 125, $initial.Height) } catch [System.InvalidOperationException] { }
              Start-Sleep -Milliseconds 350
              if ([Math]::Abs($picker.Current.BoundingRectangle.Width - $initial.Width) -gt 2) { throw 'Picker can resize horizontally' }
              $resize.Resize($initial.Width, $initial.Height + 60)
              $null = Wait-For 'vertical resize' { $picker.Current.BoundingRectangle.Height -gt $initial.Height + 25 }
              if ([Math]::Abs($picker.Current.BoundingRectangle.Width - $initial.Width) -gt 2) { throw 'Fixed window width changed' }
              Write-Host "Picker width $($initial.Width) px; vertical resize succeeded. Both card edges: $edges."
              Capture-Window $picker 'profile-picker'
              Invoke-Button $longButton
              $profile = Wait-For 'active profile on home screen' {
                  Of-Type $main ([Windows.Automation.ControlType]::Text) | Where-Object { $_.Current.Name.StartsWith('[SOCKS] Layout-check-') } | Select-Object -First 1
              }
              $hint = Find-Name $main 'Tap to choose another'
              $card = $pickerButton.Current.BoundingRectangle
              $nameBox = $profile.Current.BoundingRectangle
              $hintBox = $hint.Current.BoundingRectangle
              if ($nameBox.Height -lt 30 * $scale -or $nameBox.Bottom -gt $hintBox.Top -or $hintBox.Bottom -gt $card.Bottom) { throw "Overlapping or clipped name: name=$nameBox hint=$hintBox card=$card" }
              [Windows.Forms.Cursor]::Position = [Drawing.Point]::new(2, 2)
              Set-Clipboard -Value 'invalid-layout-test-input'
              Invoke-Button $paste
              $picker.GetCurrentPattern([Windows.Automation.WindowPattern]::Pattern).Close()
              $notice = Wait-For 'visible notification from the message queue' {
                  $message = Find-Name $main 'Operation failed, please check and retry'
                  if ($message -and !$message.Current.IsOffscreen -and $message.Current.BoundingRectangle.Height -gt 5) { $message }
              }
              Start-Sleep -Milliseconds 350
              $noticeBox = $notice.Current.BoundingRectangle
              $route = @(Of-Type $main ([Windows.Automation.ControlType]::ComboBox))[0].Current.BoundingRectangle
              if ($noticeBox.Height -le 0 -or $noticeBox.Bottom -gt $route.Top -or $noticeBox.Bottom -gt $card.Top) { throw "Notification intersects the footer: notice=$noticeBox routing=$route card=$card" }
              Capture-Window $main 'profile-notification'
              Write-Host "Two-line profile $nameBox; separate hint $hintBox; notification $noticeBox; routing $route."
          } finally { if (!$app.HasExited) { Stop-Process -Id $app.Id -Force } }
      - name: Save UI test screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-layout-screenshots
          path: |
            ${{ runner.temp }}/profile-picker.png
            ${{ runner.temp }}/profile-notification.png
          if-no-files-found: ignore
