name: Publish compact.3 release assets

on:
  push:
    branches: [release/compact-3]
    paths: ['.github/workflows/publish-compact-3.yml']

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Publish the verified Windows patch and the existing Linux archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: kvads/v2rayN-Compact-GUI
        shell: bash
        run: |
          set -euo pipefail
          tag=v8.0.1-compact.3
          previous=v8.0.1-compact.2
          windows=v2rayN-compact-windows-x64.zip
          linux=v2rayN-compact-linux-x64.tar.gz

          test "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" = "$previous"
          test -z "$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq '.[].ref')"
          test "$(gh api "repos/$GH_REPO/actions/runs/45618963916" --jq .conclusion)" = success
          gh api "repos/$GH_REPO/actions/artifacts/15023623169/zip" > "$windows"
          gh release download "$previous" --pattern "$linux"
          cat > SHA256SUMS.txt <<'SUMS'
          b2bf61f9b2c00e2f9d5831ce99891e068f1bb973c893ef67506cd1e3da43b7eb  v2rayN-compact-linux-x64.tar.gz
          216e6aa55dda3808e204806dba324d447eb367f86e126904c1ee8328adc42bc3  v2rayN-compact-windows-x64.zip
          SUMS
          sha256sum --check SHA256SUMS.txt
          cat > notes.md <<'NOTES'
          The compact Windows window now displays the connection state, component information and active configuration. The connection, routing and settings controls receive their commands when the main window opens.

          The Windows x64 portable ZIP was rebuilt from 8e750b36434a9c7d3640f9b244544127268a01af. A Windows UI smoke test launched the packaged executable, verified the connection and profile labels, and opened Settings from the gear button.

          To update on Windows, exit v2rayN from the tray and extract the ZIP into your portable installation. Keep your existing `guiConfigs` folder to retain your profiles. The Linux download is the same build published in compact.2.
          NOTES
          gh release create "$tag" "$windows" "$linux" SHA256SUMS.txt --target 8e750b36434a9c7d3640f9b244544127268a01af --latest --title 'v8.0.1-compact.3 — Windows interface fix' --notes-file notes.md
